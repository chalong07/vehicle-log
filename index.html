<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกการใช้รถ</title>
<style>
  :root { --bg:#eceff1; --card:#fff; --ink:#1b2328; --mute:#66727c; --line:#d5dbe0; --asphalt:#1d2328; --amber:#f2b705; --ok:#1f9d55; --err:#c62828; --chip:#e4e8eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121619; --card:#1d2428; --ink:#eef1f3; --mute:#97a3ad; --line:#323c43; --asphalt:#0b0e10; --chip:#2a343a; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.45 -apple-system,"Noto Sans Thai","Sarabun",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--asphalt); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 18px 16px; border-bottom:4px solid var(--amber); }
  h1 { font-size:19px; margin:0; } .sub { font-size:13px; opacity:.7; }
  main { padding:14px 14px calc(96px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .trip { background:var(--asphalt); color:#fff; border-radius:16px; padding:18px; }
  .trip .lbl { font-size:14px; opacity:.75; } .trip .meta { font-size:14px; opacity:.8; margin-top:4px; }
  .odo { display:flex; gap:3px; margin:10px 0 6px; } 
  .odo span { background:#000; color:#f4f4f0; font:700 30px/1 ui-monospace,Menlo,monospace; width:30px; padding:9px 0; text-align:center; border-radius:5px; border:1px solid #333; }
  .go { width:100%; min-height:54px; margin-top:14px; border:0; border-radius:12px; background:var(--amber); color:#1b1500; font-size:18px; font-weight:700; }
  .go:disabled { opacity:.45; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .tiles button { background:var(--card); border:1px solid var(--line); border-radius:14px; min-height:92px; font-size:26px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .tiles b { font-size:15px; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .card h2 { font-size:17px; margin:0 0 4px; }
  label { display:block; font-size:14px; color:var(--mute); margin:16px 0 6px; }
  input:not([type=hidden]), select { width:100%; min-height:50px; padding:10px 12px; font:inherit; font-size:17px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
  input:focus, select:focus { outline:2px solid var(--amber); outline-offset:1px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .chip { min-height:44px; padding:8px 14px; border:1px solid var(--line); border-radius:22px; background:var(--chip); font-size:15px; }
  .chip.on { background:var(--asphalt); border-color:var(--asphalt); color:#fff; font-weight:600; }
  .hint { min-height:22px; margin-top:12px; font-size:15px; color:var(--mute); } .hint.warn { color:#a86b00; } .hint.bad { color:var(--err); font-weight:600; }
  .savebar { position:sticky; bottom:calc(72px + env(safe-area-inset-bottom)); padding-top:8px; }
  .note { padding:12px 14px; border-radius:12px; background:var(--card); border:1px solid var(--line); margin-bottom:12px; font-size:15px; display:flex; gap:10px; align-items:center; justify-content:space-between; }
  .note.ok { border-left:5px solid var(--ok); } .note button { border:1px solid var(--line); background:var(--chip); border-radius:8px; padding:8px 12px; white-space:nowrap; }
  .msg { margin-top:12px; font-size:15px; } .bad { color:var(--err); }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; min-height:62px; border:0; background:none; font-size:12px; color:var(--mute); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  nav button span { font-size:22px; } nav button.on { color:var(--ink); font-weight:700; box-shadow:inset 0 3px 0 var(--amber); }
</style>
</head>
<body>
<header><h1>🚗 บันทึกการใช้รถ</h1><div class="sub" id="who">กำลังโหลด...</div></header>
<main id="view"><div class="card">กำลังเชื่อมต่อ LINE...</div></main>
<nav id="nav" hidden></nav>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const CFG = {
  LIFF_ID: '2011880829-ji89EJXX',
  API_URL: 'https://script.google.com/macros/s/AKfycbwQv8sfo33YKbx5TJf_mEvHI3A3STcN0c43bOLWJxu91gP4_yWRckuhqRmsnlW8I22EhQ/exec'
};
const PAY = ['เงินสด','คูปอง','บัตรเครดิตบริษัท'];
const TITLE = { start:'ออกรถ', end:'ถึงที่หมาย', fuel:'เติมน้ำมัน', exp:'ค่าใช้จ่าย' };
const NAV = [['home','🏠','หน้าหลัก'], ['trip','🚗','ทริป'], ['fuel','⛽','น้ำมัน'], ['exp','🧾','ค่าใช้จ่าย']];
const ACTION = { start:'start', end:'end', fuel:'fuel', exp:'expense' };

let S = null, view = 'home', busy = false, toast = null, undoInfo = null;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newId = () => (self.crypto && crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '') : Array.from({length: 24}, () => Math.floor(Math.random() * 36).toString(36)).join('')).slice(0, 20);
let reqId = newId();

// ===== แก้จุดพัง: อ่าน mode จาก liff.state ได้ =====
function getModeFromUrl() {
  const usp = new URLSearchParams(window.location.search);
  let mode = usp.get('mode');
  if (mode) return mode;
  // LINE จะส่ง ?mode=xxx มาเป็น ?liff.state=%3Fmode%3Dxxx สำหรับคนอื่น
  const liffState = usp.get('liff.state');
  if (liffState) {
    try {
      // liff.state อาจเป็น "?mode=start" หรือ "mode=start" ที่ encode มา
      const decoded = decodeURIComponent(liffState);
      const usp2 = new URLSearchParams(decoded.startsWith('?') ? decoded : '?' + decoded);
      mode = usp2.get('mode');
      if (mode) return mode;
      // เผื่อกรณีเป็น /?mode=start ตรงๆ
      const usp3 = new URLSearchParams(liffState);
      mode = usp3.get('mode');
      if (mode) return mode;
    } catch (e) {}
  }
  // เผื่อกรณี LIFF ส่งมาใน hash
  if (window.location.hash) {
    try {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      mode = hashParams.get('mode');
      if (mode) return mode;
    } catch (e) {}
  }
  return null;
}

async function api(action, data) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 60000);
  try {
    const r = await fetch(CFG.API_URL, { method:'POST', body: JSON.stringify({ idToken: liff.getIDToken(), action, data }), signal: ctl.signal });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    return j;
  } catch (e) {
    if (e.name === 'AbortError' || e instanceof TypeError) throw new Error('ติดต่อระบบไม่ได้/ช้าเกินไป — กดบันทึกอีกครั้งได้เลย ระบบกันบันทึกซ้ำให้');
    throw e;
  } finally { clearTimeout(timer); }
}

async function main() {
  try {
    await liff.init({ liffId: CFG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    S = await api('init', {});
    const m = getModeFromUrl();   // แก้แล้ว: รองรับ ?mode= และ ?liff.state=%3Fmode%3D
    if (m === 'fuel' || m === 'exp') view = m;
    else if (m === 'start' || m === 'end' || m === 'trip') view = S.openTrip ? 'end' : 'start';
    else if (S.openTrip) view = 'home';
    render();
  } catch (e) { fail(e); }
}

function go(v) {
  if (v === 'trip') v = S.openTrip ? 'end' : 'start';
  if (v === 'start' && S.openTrip) v = 'end';
  if (v === 'end' && !S.openTrip) v = 'start';
  view = v; toast = null; reqId = newId(); render(); scrollTo(0, 0);
}

function render() {
  if (S.state === 'new') {
    $('who').textContent = 'ลงทะเบียนครั้งแรก';
    $('view').innerHTML = `<div class="card"><label>ชื่อ-นามสกุลพนักงานขับรถ</label><input id="name" autocomplete="name">
      <button class="go" id="reg">ลงทะเบียน</button><div class="msg" id="msg"></div></div>`;
    $('reg').onclick = () => submitBtn($('reg'), () => api('register', {name: $('name').value}).then(r => { S = r; render(); }));
    return;
  }
  if (S.state === 'pending') {
    $('who').textContent = S.name || '';
    $('view').innerHTML = '<div class="card">ลงทะเบียนแล้ว รอผู้ดูแลอนุมัติ แล้วเปิดใหม่อีกครั้ง</div>';
    return;
  }
  $('who').textContent = 'คนขับ: ' + S.name;
  const cur = (view === 'start' || view === 'end') ? 'trip' : view;
  $('nav').hidden = false;
  $('nav').innerHTML = NAV.map(n => `<button data-nav="${n[0]}" class="${n[0] === cur ? 'on' : ''}"><span>${n[1]}</span>${n[2]}</button>`).join('');
  view === 'home' ? renderHome() : renderForm();
}

const odo = n => String(Math.round(Number(n) || 0)).padStart(6, '0').split('').map(d => `<span>${d}</span>`).join('');
function elapsed(t) {
  const p = String(t).split(':').map(Number), n = new Date();
  let d = n.getHours() * 60 + n.getMinutes() - (p[0] * 60 + p[1]); if (d < 0) d += 1440;
  return d >= 60 ? Math.floor(d / 60) + ' ชม. ' + (d % 60) + ' น.' : d + ' นาที';
}

function renderHome() {
  const t = S.openTrip;
  let h = '';
  if (toast) {
    const can = undoInfo && Date.now() - undoInfo.at < 600000;
    h += `<div class="note ok"><span>✅ ${esc(toast)}</span>${can ? '<button data-undo>ยกเลิกรายการนี้</button>' : ''}</div>`;
  }
  h += t
    ? `<section class="trip"><div class="lbl">กำลังใช้รถ ${esc(t.car)}</div><div class="odo" aria-label="ไมล์ออก ${esc(t.startKm)}">${odo(t.startKm)}</div>
       <div class="meta">ออก ${esc(t.time)} จาก ${esc(t.from)} · ผ่านไป ${elapsed(t.time)}</div>
       <div class="meta">${esc(t.user)}${t.detail ? ' · ' + esc(t.detail) : ''}</div><button class="go" data-go="end">ถึงที่หมายแล้ว</button></section>`
    : `<section class="trip"><div class="lbl">ยังไม่มีทริปที่เปิดอยู่</div><div class="meta">แตะเมื่อเริ่มใช้รถ</div><button class="go" data-go="start">ออกรถ</button></section>`;
  h += `<div class="tiles"><button data-go="fuel">⛽<b>เติมน้ำมัน</b></button><button data-go="exp">🧾<b>ค่าใช้จ่าย</b></button></div><div class="msg" id="msg"></div>`;
  $('view').innerHTML = h;
}

function fields() {
  const L = S.last || {};
  const F = {
    start: [
      {id:'car', label:'รถ', type:'choice', opts:S.cars, def:L.car},
      {id:'startKm', label:'เลขไมล์ตอนออกรถ (กม.)', type:'num'},
      {id:'from', label:'จุดออกรถ', type:'place', def:L.to},
      {id:'user', label:'ผู้ใช้รถ (ผู้โดยสาร/ผู้ขอใช้รถ)', type:'text', def:L.user},
      {id:'purpose', label:'วัตถุประสงค์', type:'choice', opts:S.purposes, def:L.purpose},
      {id:'dept', label:'แผนกที่ขอใช้', type:'choice', opts:S.depts, def:L.dept},
      {id:'detail', label:'ไปรับใคร / ไปทำอะไร', type:'text'}],
    end: [
      {id:'endKm', label:'เลขไมล์ตอนถึง (กม.)', type:'num'},
      {id:'to', label:'จุดที่มาถึง', type:'place'},
      {id:'remark', label:'หมายเหตุ (ถ้ามี)', type:'text'}],
    fuel: [
      {id:'car', label:'รถ', type:'choice', opts:S.cars, def:L.car},
      {id:'type', label:'ชนิดน้ำมัน', type:'choice', opts:S.fuelTypes},
      {id:'liters', label:'จำนวนลิตร', type:'num'},
      {id:'baht', label:'จำนวนเงิน (บาท)', type:'num'},
      {id:'station', label:'เติมที่ไหน (ปั๊ม/สาขา)', type:'place'},
      {id:'km', label:'เลขไมล์ตอนเติม (กม.)', type:'num'},
      {id:'pay', label:'ชำระด้วย', type:'choice', opts:PAY}],
    exp: [
      {id:'car', label:'รถ', type:'choice', opts:S.cars, def:L.car},
      {id:'kind', label:'ประเภท', type:'choice', opts:S.expKinds},
      {id:'baht', label:'จำนวนเงิน (บาท)', type:'num'},
      {id:'place', label:'ด่าน / ร้าน / สถานที่', type:'place'}]
  };
  return F[view];
}

function field(f) {
  const id = 'f_' + f.id, def = f.def || '';
  let el;
  if (f.type === 'choice') {
    const o = f.opts, v = o.indexOf(def) >= 0 ? def : o[0];
    el = o.length <= 6
      ? `<input type="hidden" id="${id}" value="${esc(v)}"><div class="chips" data-for="${id}">${o.map(x => `<button type="button" class="chip${x === v ? ' on' : ''}">${esc(x)}</button>`).join('')}</div>`
      : `<select id="${id}">${o.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
  } else if (f.type === 'num') el = `<input id="${id}" type="text" inputmode="decimal" autocomplete="off">`;
  else if (f.type === 'place') {
    const ps = (S.last && S.last.places || []).slice(0, 6);
    el = `<input id="${id}" autocomplete="off" value="${esc(def)}">` + (ps.length ? `<div class="chips" data-fill="${id}">${ps.map(p => `<button type="button" class="chip">${esc(p)}</button>`).join('')}</div>` : '');
  } else el = `<input id="${id}" autocomplete="off" value="${esc(def)}">`;
  return `<label for="${id}">${f.label}</label>${el}`;
}

function renderForm() {
  let top = '';
  if (view === 'end') {
    const t = S.openTrip;
    top = `<div class="trip" style="margin-bottom:14px"><div class="lbl">${esc(t.car)} · ออก ${esc(t.time)} จาก ${esc(t.from)}</div><div class="odo">${odo(t.startKm)}</div><div class="meta">${esc(t.user)}${t.detail ? ' · ' + esc(t.detail) : ''}</div></div>`;
  }
  $('view').innerHTML = `${top}<div class="card"><h2>${TITLE[view]}</h2>${fields().map(field).join('')}<div class="hint" id="hint"></div></div>
    <div class="savebar"><button class="go" id="send">บันทึก</button></div><div class="msg" id="msg"></div>`;
  fillKm(); check();
  $('send').onclick = () => submitBtn($('send'), async () => {
    const data = { reqId };
    fields().forEach(f => data[f.id] = $('f_' + f.id).value);
    const r = await api(ACTION[view], data);
    reqId = newId();
    if (r.state === 'ok' && Array.isArray(r.cars)) S = r;
    else { try { S = await api('init', {}); } catch (e) { } }
    toast = r.msg; undoInfo = r.undo ? Object.assign({at: Date.now()}, r.undo) : null;
    view = 'home'; render(); scrollTo(0, 0);
  });
}

const val = id => { const e = $('f_' + id); return e ? e.value : ''; };
const numv = id => parseFloat(String(val(id)).replace(/,/g, ''));
function fillKm() {
  const k = $('f_startKm') || $('f_km');
  if (k && $('f_car')) { const v = S.lastKm[val('car')]; k.value = v !== undefined ? v : ''; }
}
function check() {
  const h = $('hint'), b = $('send'); if (!h) return;
  let msg = '', cls = '', block = false;
  if (view === 'end') {
    const d = numv('endKm') - Number(S.openTrip.startKm);
    if (!isNaN(d)) { if (d < 0) { msg = 'ไมล์ถึงต้องไม่น้อยกว่าไมล์ออก (' + S.openTrip.startKm + ')'; cls = 'bad'; block = true; } else msg = 'ระยะทาง ' + d + ' กม.'; if (d > 500) { msg += ' — ไกลผิดปกติ ตรวจเลขไมล์อีกครั้ง'; cls = 'warn'; } }
  } else if (view === 'start' || view === 'fuel') {
    const km = numv(view === 'start' ? 'startKm' : 'km'), last = S.lastKm[val('car')];
    if (!isNaN(km) && last !== undefined && km < Number(last)) { msg = 'ไมล์ต่ำกว่าครั้งก่อน (' + last + ') ตรวจอีกครั้ง'; cls = 'warn'; }
    if (view === 'fuel' && !msg) {
      const l = numv('liters'), bt = numv('baht');
      if (l > 0 && bt > 0) { const p = bt / l; msg = '≈ ' + p.toFixed(2) + ' บาท/ลิตร'; if (val('type') !== 'น้ำมันเครื่อง' && (p < 15 || p > 90)) { msg += ' — ราคาผิดปกติ ตรวจลิตรและบาท'; cls = 'warn'; } }
    }
  }
  h.textContent = msg; h.className = 'hint ' + cls; if (b) b.disabled = block || busy;
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.nav) return go(t.dataset.nav);
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.undo !== undefined && undoInfo) {
    const u = undoInfo;
    return submitBtn(t, async () => { const r = await api('undo', {what: u.what, id: u.id}); undoInfo = null; S = r; toast = r.msg; render(); });
  }
  if (t.classList.contains('chip')) {
    const g = t.parentNode;
    if (g.dataset.for) { g.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === t)); $(g.dataset.for).value = t.textContent; if (g.dataset.for === 'f_car') fillKm(); }
    else if (g.dataset.fill) $(g.dataset.fill).value = t.textContent;
    check();
  }
});
document.addEventListener('input', check);
document.addEventListener('change', e => { if (e.target.id === 'f_car') fillKm(); check(); });

async function submitBtn(btn, fn) {
  if (busy) return;
  busy = true; btn.disabled = true;
  const m = $('msg'); if (m) m.textContent = 'กำลังบันทึก...';
  try { await fn(); }
  catch (e) { btn.disabled = false; const m2 = $('msg'); if (m2) m2.innerHTML = `<span class="bad">❌ ${esc(e.message)}</span>`; }
  finally { busy = false; }
}

function fail(e) { $('view').innerHTML = `<div class="card bad">เปิดไม่สำเร็จ: ${esc(e.message || e)}<br><br>ลองปิดแล้วเปิดใหม่จาก Rich Menu</div>`; $('who').textContent = ''; }

main();
</script>
</body>
</html>
