<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกการใช้รถ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1d2a24;--mute:#6b7872;--line:#dfe5e0;--accent:#0f6b4f;--accent-ink:#fff;--warn:#b3321f}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--ink:#e8efeb;--mute:#8fa097;--line:#2c3933;--accent:#3fbf94;--accent-ink:#06231a;--warn:#ff8a73}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Noto Sans Thai',system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
header{padding:20px 16px 8px}
h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--mute);font-size:14px}
section{background:var(--card);margin:12px;padding:16px;border-radius:14px;border:1px solid var(--line)}
label,.lbl{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
label:first-child,.lbl:first-child{margin-top:0}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{font-size:13px;color:var(--mute);margin-top:4px}
.dist{font-size:20px;font-weight:700;color:var(--accent)}
details{margin:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px}
summary{padding:14px 0;font-weight:600;cursor:pointer}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:14px}
details>div{padding-bottom:16px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.bar button{width:100%;font:inherit;font-weight:700;font-size:17px;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.bar button:disabled{opacity:.5}
.err{color:var(--warn);font-size:14px;margin:0 16px;min-height:1px}
#done{display:none;text-align:center;padding:60px 24px}
#done h2{font-size:24px;margin:8px 0}
#done button{margin-top:20px;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 20px;border-radius:10px}
</style>
</head>
<body>
<div id="app">
<header><h1>บันทึกการใช้รถ</h1><p id="who">กำลังโหลด…</p></header>

<section>
  <div id="nameBox" style="display:none"><label for="manualName">ชื่อคนขับ</label><input id="manualName" placeholder="พิมพ์ชื่อ"></div>
  <label for="vehicle">รถ</label>
  <select id="vehicle"></select>

  <label for="from">ออกจาก</label>
  <input id="from" placeholder="จุดออกรถ">

  <label for="to">ไปที่</label>
  <input id="to" placeholder="พิมพ์ หรือกดเลือกด้านล่าง">
  <div class="chips" id="placeChips"></div>
</section>

<section>
  <div class="row">
    <div><label for="ms">ไมล์เริ่ม</label><input id="ms" type="number" inputmode="numeric"></div>
    <div><label for="me">ไมล์จบ</label><input id="me" type="number" inputmode="numeric" placeholder="กรอกตอนถึง"></div>
  </div>
  <div class="hint">ไมล์เริ่มดึงจากทริปก่อนหน้าให้อัตโนมัติ · ระยะทาง <span class="dist" id="dist">–</span> กม.</div>
</section>

<section>
  <div class="lbl">ไปกับใครบ้าง / รับ-ส่งใคร</div>
  <div class="chips" id="staffChips"></div>
  <label for="note">หมายเหตุ (ไม่บังคับ)</label>
  <textarea id="note" rows="2"></textarea>
</section>

<details>
  <summary>น้ำมัน (ถ้ามีเติม)</summary>
  <div>
    <label for="fuelType">ชนิด</label>
    <select id="fuelType"><option value="">–</option><option>ดีเซล</option><option>เบนซิน 91</option><option>แก๊สโซฮอล์ 95</option><option>แก๊สโซฮอล์ E20</option></select>
    <div class="row">
      <div><label for="fuelLiters">ลิตร</label><input id="fuelLiters" type="number" inputmode="decimal"></div>
      <div><label for="fuelPrice">ราคารวม (บาท)</label><input id="fuelPrice" type="number" inputmode="decimal"></div>
    </div>
    <label for="fuelPay">จ่ายด้วย</label>
    <select id="fuelPay"><option value="">–</option><option>เงินสด</option><option>คูปอง</option><option>บัตรเครดิตบริษัท</option></select>
  </div>
</details>

<details>
  <summary>ค่าใช้จ่ายอื่น</summary>
  <div class="row">
    <div><label for="food">อาหาร</label><input id="food" type="number" inputmode="decimal"></div>
    <div><label for="toll">ทางด่วน</label><input id="toll" type="number" inputmode="decimal"></div>
  </div>
  <label for="tag">Tag</label><input id="tag" type="number" inputmode="decimal">
</details>

<p class="err" id="err" role="alert"></p>
<div class="bar"><button id="save" disabled>บันทึกการเดินทาง</button></div>
</div>

<div id="done">
  <h2>บันทึกแล้ว</h2>
  <p id="doneMsg"></p>
  <button id="again">บันทึกทริปใหม่</button>
</div>

<script>
// ===== ตั้งค่า 2 ค่านี้ก่อนใช้งาน =====
const LIFF_ID = 'ใส่-LIFF-ID';
const GAS_URL = 'ใส่-URL-ของ-Apps-Script-Web-App';
// =====================================

const $ = id => document.getElementById(id);
let cfg = {vehicles:[], staff:[], places:[]}, user = {name:'', id:''};
const picked = new Set();

function chips(el, items, onTap, multi){
  el.innerHTML = '';
  items.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = t; b.setAttribute('aria-pressed','false');
    b.onclick = () => { if (multi) b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')==='false'); onTap(t, b); };
    el.appendChild(b);
  });
}

function applyVehicle(){
  const v = cfg.vehicles.find(x => x.id === $('vehicle').value);
  if (!v) return;
  $('ms').value = v.lastMile || '';
  $('from').value = v.lastPlace || $('from').value;
  localStorage.setItem('lastVehicle', v.id);
  calc();
}
function calc(){
  const d = Number($('me').value) - Number($('ms').value);
  $('dist').textContent = $('me').value && d >= 0 ? d : '–';
}

async function init(){
  // 1) โหลดรายการจากชีตก่อน ไม่ขึ้นกับ LIFF
  try {
    const res = await fetch(GAS_URL);
    cfg = await res.json();
  } catch(e) { $('who').textContent = 'โหลดรายการจากชีตไม่สำเร็จ'; $('err').textContent = 'เช็ค GAS_URL และการ Deploy (Access: Anyone) · ' + e.message; return; }

  $('vehicle').innerHTML = cfg.vehicles.map(v => `<option value="${v.id}">${v.id} ${v.name||''}</option>`).join('');
  const last = localStorage.getItem('lastVehicle');
  if (last && cfg.vehicles.some(v => v.id === last)) $('vehicle').value = last;
  chips($('placeChips'), cfg.places, t => $('to').value = t, false);
  chips($('staffChips'), cfg.staff, (t,b) => b.getAttribute('aria-pressed')==='true' ? picked.add(t) : picked.delete(t), true);
  applyVehicle();
  $('who').textContent = 'กำลังเชื่อมต่อ LINE…';

  // 2) ค่อยเชื่อม LINE ถ้าไม่สำเร็จให้กรอกชื่อเอง
  try {
    await Promise.race([liff.init({liffId: LIFF_ID}), new Promise((_,rj)=>setTimeout(()=>rj(new Error('LIFF หมดเวลา')),8000))]);
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const p = await liff.getProfile(); user = {name: p.displayName, id: p.userId};
    $('who').textContent = 'คนขับ: ' + user.name;
  } catch(e) {
    $('who').textContent = 'เชื่อม LINE ไม่ได้ กรอกชื่อคนขับด้านล่าง';
    $('err').textContent = 'LIFF: ' + (e.message || e);
    $('nameBox').style.display = 'block';
  }
  $('save').disabled = false;
}

$('vehicle').onchange = applyVehicle;
$('ms').oninput = $('me').oninput = calc;

$('save').onclick = async () => {
  const ms = Number($('ms').value), me = Number($('me').value);
  if (!(user.name || $('manualName').value.trim())) return $('err').textContent = 'กรอกชื่อคนขับ';
  if (!$('to').value.trim()) return $('err').textContent = 'กรอกสถานที่ที่ไป';
  if (!$('me').value || me < ms) return $('err').textContent = 'ไมล์จบต้องมากกว่าหรือเท่ากับไมล์เริ่ม';
  $('err').textContent = ''; $('save').disabled = true; $('save').textContent = 'กำลังบันทึก…';
  const body = {
    driver:user.name || $('manualName').value.trim(), userId:user.id, vehicle:$('vehicle').value,
    from:$('from').value.trim(), to:$('to').value.trim(), mileStart:ms, mileEnd:me,
    passengers:[...picked], note:$('note').value.trim(),
    fuelType:$('fuelType').value, fuelLiters:$('fuelLiters').value, fuelPrice:$('fuelPrice').value, fuelPay:$('fuelPay').value,
    food:$('food').value, toll:$('toll').value, tag:$('tag').value
  };
  try {
    const r = await (await fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)})).json();
    if (!r.ok) throw new Error(r.error);
    $('doneMsg').textContent = `ระยะทาง ${r.distance} กม. ไป ${body.to}`;
    $('app').style.display = 'none'; $('done').style.display = 'block';
  } catch(e) {
    $('err').textContent = 'บันทึกไม่สำเร็จ: ' + e.message;
    $('save').disabled = false; $('save').textContent = 'บันทึกการเดินทาง';
  }
};
$('again').onclick = () => location.reload();
init();
</script>
</body>
</html>
